# Staleness thresholds
staleness:
  pull_requests_days: 30
  issues_days: 365
  problematic_stale_issues_pct: 20
  problematic_stale_prs_pct: 20

# Hourly: with 68 repos, workflow-run queries are not ETag-cached and would
# exceed GitHub's 5000 req/h limit at shorter intervals.
refresh_schedule: "0 * * * *"

# Paths (separate from the default config so the two instances don't share state)
data_dir: "./data"
workspace_dir: "./workspace-mlops"
database_path: "./grimoire-mlops.db"
log_file: "./grimoire-mlops.log"
